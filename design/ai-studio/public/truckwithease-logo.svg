<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Rich Golden Metallic Gradients matching the design -->
    <linearGradient id="tweGoldTruck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF275" />
      <stop offset="25%" stopColor="#FFD700" />
      <stop offset="60%" stopColor="#F5B800" />
      <stop offset="100%" stopColor="#C48800" />
    </linearGradient>

    <linearGradient id="tweGoldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFF9A6" />
      <stop offset="40%" stopColor="#FFD700" />
      <stop offset="100%" stopColor="#E5A600" />
    </linearGradient>

    <linearGradient id="tweGoldHorizontal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#F5B800" />
      <stop offset="50%" stopColor="#FFD700" />
      <stop offset="100%" stopColor="#FFF48C" />
    </linearGradient>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Black Canvas -->
  <rect width="800" height="800" fill="#0A0A0E" />

  <!-- ============================================================== -->
  <!-- 1. AERODYNAMIC CLASS 8 SEMI-TRUCK IN 3/4 PERSPECTIVE           -->
  <!-- ============================================================== -->
  <g transform="translate(10, 40)" filter="url(#softGlow)">
    
    <!-- 3 KINETIC SPEED WINGS / TRAILER AIR TRAILS (Top Right) -->
    <!-- Top-most aerodynamic trailer streak -->
    <path d="M 285 145 C 330 130, 480 120, 510 135 C 570 160, 640 230, 680 270 C 650 250, 560 195, 490 175 C 440 160, 360 160, 290 170 Z" 
          fill="url(#tweGoldTruck)" />

    <!-- Middle aerodynamic speed streak -->
    <path d="M 500 205 C 555 235, 620 290, 675 340 C 630 315, 565 270, 510 240 C 495 230, 490 220, 500 205 Z" 
          fill="url(#tweGoldTruck)" />

    <!-- Bottom aerodynamic speed streak -->
    <path d="M 515 270 C 560 305, 615 355, 670 405 C 625 380, 570 335, 520 300 C 510 290, 510 280, 515 270 Z" 
          fill="url(#tweGoldTruck)" />

    <!-- SLEEPER CAB ROOF & VISOR ARCH -->
    <!-- Visor / Fairing Cap -->
    <path d="M 270 148 C 300 140, 460 140, 485 155 C 500 165, 500 195, 490 215 C 475 220, 460 215, 455 195 C 445 175, 310 168, 255 180 C 240 185, 230 180, 240 165 C 245 155, 255 150, 270 148 Z" 
          fill="url(#tweGoldTruck)" />

    <!-- Upper Cab Body Shell -->
    <path d="M 245 185 C 300 175, 435 180, 455 198 C 475 215, 490 270, 495 330 C 480 325, 475 300, 468 250 C 465 225, 440 210, 420 208 C 320 200, 255 210, 230 218 C 220 210, 225 195, 245 185 Z" 
          fill="url(#tweGoldHighlight)" />

    <!-- WINDSHIELD (Angled in 3/4 Perspective) -->
    <path d="M 235 224 C 260 220, 395 216, 408 220 C 418 224, 405 290, 398 305 C 385 315, 245 328, 222 322 C 212 315, 222 230, 235 224 Z" 
          fill="url(#tweGoldTruck)" />
    <!-- Windshield Glass Cavity (Negative Space with Gold Border) -->
    <path d="M 244 234 C 265 230, 385 226, 394 230 C 400 234, 390 286, 384 296 C 372 304, 252 316, 236 312 C 228 306, 236 240, 244 234 Z" 
          fill="#0A0A0E" />

    <!-- SIDE PASSENGER WINDOW (To the right) -->
    <path d="M 425 225 C 440 225, 465 232, 468 245 C 472 270, 468 310, 460 325 C 448 322, 435 320, 425 318 C 430 300, 435 260, 425 225 Z" 
          fill="url(#tweGoldTruck)" />
    <!-- Side Window Cavity -->
    <path d="M 434 236 C 444 236, 458 242, 460 252 C 463 270, 460 298, 454 310 C 444 308, 438 306, 434 305 C 437 290, 440 260, 434 236 Z" 
          fill="#0A0A0E" />

    <!-- HOOD & FRONT FENDER (Muscular Aerodynamic Curve) -->
    <!-- Large Front-Right Sweeping Fender -->
    <path d="M 338 335 C 370 330, 435 340, 445 370 C 455 400, 450 470, 440 500 C 432 505, 422 495, 426 470 C 432 430, 415 390, 380 382 C 340 375, 305 385, 290 395 C 285 385, 310 345, 338 335 Z" 
          fill="url(#tweGoldTruck)" />

    <!-- Wheel Arch Inner Shadow -->
    <path d="M 440 450 C 445 420, 435 390, 400 380 C 370 375, 340 388, 330 405 C 322 425, 325 450, 330 470 C 335 480, 330 490, 320 495 C 310 470, 305 430, 325 395 C 345 365, 395 355, 430 370 C 455 385, 465 420, 455 460 Z" 
          fill="#0A0A0E" />

    <!-- Center Hood Peak Line -->
    <path d="M 230 335 C 265 330, 320 332, 338 340 C 315 352, 240 365, 195 372 C 190 362, 210 342, 230 335 Z" 
          fill="url(#tweGoldHighlight)" />

    <!-- Lower Hood Slope -->
    <path d="M 195 378 C 240 370, 320 355, 340 348 C 335 365, 315 395, 295 405 C 245 418, 185 425, 172 422 C 168 412, 180 388, 195 378 Z" 
          fill="url(#tweGoldTruck)" />

    <!-- FRONT GRILLE (Bold Forward-Facing Chrome Shield) -->
    <!-- Grille Outer Frame -->
    <path d="M 145 405 C 160 398, 245 390, 260 400 C 268 408, 255 500, 248 518 C 235 528, 145 532, 134 522 C 125 510, 135 415, 145 405 Z" 
          fill="url(#tweGoldTruck)" />
    
    <!-- Grille Slat 1 (Top) -->
    <path d="M 152 416 C 170 410, 238 405, 248 412 C 250 422, 248 436, 244 440 C 230 444, 160 448, 150 442 C 146 434, 148 422, 152 416 Z" 
          fill="url(#tweGoldHorizontal)" />
    
    <!-- Grille Slat 2 -->
    <path d="M 150 450 C 165 446, 232 442, 242 448 C 244 456, 242 466, 238 470 C 225 474, 158 478, 148 472 C 145 464, 146 455, 150 450 Z" 
          fill="url(#tweGoldHorizontal)" />

    <!-- Grille Slat 3 -->
    <path d="M 148 478 C 162 474, 226 470, 236 476 C 238 484, 236 492, 232 496 C 220 500, 155 504, 146 498 C 143 490, 144 482, 148 478 Z" 
          fill="url(#tweGoldHorizontal)" />

    <!-- Grille Slat 4 (Bottom) -->
    <path d="M 146 504 C 160 500, 220 496, 230 502 C 231 508, 228 516, 224 520 C 215 524, 152 526, 144 522 C 142 516, 143 508, 146 504 Z" 
          fill="url(#tweGoldHorizontal)" />

    <!-- LEFT CORNER FENDER & HEADLIGHT ACCENT -->
    <path d="M 130 435 C 135 430, 140 432, 140 440 C 138 470, 132 505, 126 515 C 118 518, 115 512, 118 495 C 122 475, 126 450, 130 435 Z" 
          fill="url(#tweGoldTruck)" />

    <!-- FRONT BUMPER (Low Aerodynamic Ground Sweep) -->
    <path d="M 108 522 C 130 518, 245 515, 260 522 C 265 528, 255 550, 248 555 C 220 560, 120 562, 104 555 C 98 548, 100 530, 108 522 Z" 
          fill="url(#tweGoldTruck)" />

    <!-- Bumper Lower Splitter Lip -->
    <path d="M 112 562 C 130 558, 230 556, 242 562 C 244 568, 238 574, 232 576 C 210 580, 125 582, 112 576 C 108 572, 108 566, 112 562 Z" 
          fill="url(#tweGoldHighlight)" />

    <!-- Right Side Skirt / Running Board Line -->
    <path d="M 270 545 C 310 540, 395 530, 425 528 C 432 535, 428 548, 420 550 C 390 554, 305 560, 268 562 C 262 555, 265 548, 270 545 Z" 
          fill="url(#tweGoldTruck)" />
  </g>

  <!-- ============================================================== -->
