      <line x1="-12" y1="-28" x2="4" y2="-28" stroke="#FFD700" stroke-width="2.5" />
      <line x1="-18" y1="-22" x2="2" y2="-22" stroke="#FFD700" stroke-width="2" />
      <line x1="-10" y1="-16" x2="8" y2="-16" stroke="#FFD700" stroke-width="2" />
