<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%">
  <defs>
    <linearGradient id="morrishiveGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF280" />
      <stop offset="40%" stopColor="#FFD700" />
      <stop offset="80%" stopColor="#D4AF37" />
      <stop offset="100%" stopColor="#9C7707" />
    </linearGradient>
    <linearGradient id="innerShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#141720" />
      <stop offset="100%" stopColor="#0B0D12" />
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="420" height="120" rx="14" fill="#0C0E12" />

  <!-- LEFT: Hexagonal Morrishive Emblem -->
  <g transform="translate(18, 10)">
    <!-- Outer Hexagon -->
    <polygon points="50,4 92,27 92,73 50,96 8,73 8,27" 
             fill="url(#innerShield)" 
             stroke="url(#morrishiveGold)" 
             stroke-width="3.5" />

    <!-- Inner Dotted Hexagon -->
    <polygon points="50,11 85,30 85,70 50,89 15,70 15,30" 
             fill="none" 
             stroke="#F2CA50" 
             stroke-width="1.6" 
             stroke-dasharray="3,3" 
             opacity="0.85" />

    <!-- Left Vertical Gold Column -->
    <rect x="25" y="34" width="14" height="34" rx="1.5" fill="url(#morrishiveGold)" />

    <!-- Right Vertical Gold Column -->
    <rect x="61" y="34" width="14" height="34" rx="1.5" fill="url(#morrishiveGold)" />

    <!-- Center Kinetic Arrowhead / Spear -->
    <polygon points="50,22 58,47 50,55 42,47" fill="#FFF280" />
    <circle cx="50" cy="50" r="3" fill="#FFFFFF" />

    <!-- Lower Diamond Tail -->
    <polygon points="50,62 55,75 50,82 45,75" fill="url(#morrishiveGold)" />
  </g>

  <!-- RIGHT: MORRISHIVE ENTERPRISE LOGISTICS Typography -->
  <g transform="translate(130, 48)">
    <text font-family="'Oswald', -apple-system, sans-serif" 
          font-weight="900" 
          font-size="30" 
          fill="#FFFFFF" 
          letter-spacing="4">
      MORRISHIVE
    </text>
    <text y="32" 
          font-family="monospace, 'Courier New'" 
          font-weight="900" 
          font-size="13" 
          fill="#D4AF37" 
          letter-spacing="3.5">
      ENTERPRISE LOGISTICS &amp; TELEMETRY
    </text>
  </g>
</svg>
