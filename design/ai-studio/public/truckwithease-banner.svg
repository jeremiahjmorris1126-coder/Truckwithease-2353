<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="100%" height="100%">
  <defs>
    <linearGradient id="truckGoldBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF275" />
      <stop offset="25%" stopColor="#FFD700" />
      <stop offset="60%" stopColor="#F5B800" />
      <stop offset="100%" stopColor="#C48800" />
    </linearGradient>
    <linearGradient id="truckGoldH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#F5B800" />
      <stop offset="50%" stopColor="#FFD700" />
      <stop offset="100%" stopColor="#FFF48C" />
    </linearGradient>
    <filter id="bannerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1100" height="320" rx="16" fill="#0A0A0E" />

  <!-- LEFT: Exact Aerodynamic Semi-Truck Graphic -->
  <g transform="translate(20, -20) scale(0.55)" filter="url(#bannerGlow)">
    <!-- 3 Speed Ribbons -->
    <path d="M 285 145 C 330 130, 480 120, 510 135 C 570 160, 640 230, 680 270 C 650 250, 560 195, 490 175 C 440 160, 360 160, 290 170 Z" fill="url(#truckGoldBanner)" />
    <path d="M 500 205 C 555 235, 620 290, 675 340 C 630 315, 565 270, 510 240 C 495 230, 490 220, 500 205 Z" fill="url(#truckGoldBanner)" />
    <path d="M 515 270 C 560 305, 615 355, 670 405 C 625 380, 570 335, 520 300 C 510 290, 510 280, 515 270 Z" fill="url(#truckGoldBanner)" />
    <!-- Visor -->
    <path d="M 270 148 C 300 140, 460 140, 485 155 C 500 165, 500 195, 490 215 C 475 220, 460 215, 455 195 C 445 175, 310 168, 255 180 C 240 185, 230 180, 240 165 C 245 155, 255 150, 270 148 Z" fill="url(#truckGoldBanner)" />
    <!-- Upper Body Shell -->
    <path d="M 245 185 C 300 175, 435 180, 455 198 C 475 215, 490 270, 495 330 C 480 325, 475 300, 468 250 C 465 225, 440 210, 420 208 C 320 200, 255 210, 230 218 C 220 210, 225 195, 245 185 Z" fill="url(#truckGoldBanner)" />
    <!-- Windshield -->
    <path d="M 235 224 C 260 220, 395 216, 408 220 C 418 224, 405 290, 398 305 C 385 315, 245 328, 222 322 C 212 315, 222 230, 235 224 Z" fill="url(#truckGoldBanner)" />
    <path d="M 244 234 C 265 230, 385 226, 394 230 C 400 234, 390 286, 384 296 C 372 304, 252 316, 236 312 C 228 306, 236 240, 244 234 Z" fill="#0A0A0E" />
    <!-- Side Window -->
    <path d="M 425 225 C 440 225, 465 232, 468 245 C 472 270, 468 310, 460 325 C 448 322, 435 320, 425 318 C 430 300, 435 260, 425 225 Z" fill="url(#truckGoldBanner)" />
    <path d="M 434 236 C 444 236, 458 242, 460 252 C 463 270, 460 298, 454 310 C 444 308, 438 306, 434 305 C 437 290, 440 260, 434 236 Z" fill="#0A0A0E" />
    <!-- Fender -->
    <path d="M 338 335 C 370 330, 435 340, 445 370 C 455 400, 450 470, 440 500 C 432 505, 422 495, 426 470 C 432 430, 415 390, 380 382 C 340 375, 305 385, 290 395 C 285 385, 310 345, 338 335 Z" fill="url(#truckGoldBanner)" />
    <!-- Hood -->
    <path d="M 195 378 C 240 370, 320 355, 340 348 C 335 365, 315 395, 295 405 C 245 418, 185 425, 172 422 C 168 412, 180 388, 195 378 Z" fill="url(#truckGoldBanner)" />
    <!-- Grille Frame -->
    <path d="M 145 405 C 160 398, 245 390, 260 400 C 268 408, 255 500, 248 518 C 235 528, 145 532, 134 522 C 125 510, 135 415, 145 405 Z" fill="url(#truckGoldBanner)" />
    <!-- 4 Grille Slats -->
    <path d="M 152 416 C 170 410, 238 405, 248 412 C 250 422, 248 436, 244 440 C 230 444, 160 448, 150 442 C 146 434, 148 422, 152 416 Z" fill="url(#truckGoldH)" />
    <path d="M 150 450 C 165 446, 232 442, 242 448 C 244 456, 242 466, 238 470 C 225 474, 158 478, 148 472 C 145 464, 146 455, 150 450 Z" fill="url(#truckGoldH)" />
    <path d="M 148 478 C 162 474, 226 470, 236 476 C 238 484, 236 492, 232 496 C 220 500, 155 504, 146 498 C 143 490, 144 482, 148 478 Z" fill="url(#truckGoldH)" />
    <path d="M 146 504 C 160 500, 220 496, 230 502 C 231 508, 228 516, 224 520 C 215 524, 152 526, 144 522 C 142 516, 143 508, 146 504 Z" fill="url(#truckGoldH)" />
    <!-- Left Accent -->
    <path d="M 130 435 C 135 430, 140 432, 140 440 C 138 470, 132 505, 126 515 C 118 518, 115 512, 118 495 C 122 475, 126 450, 130 435 Z" fill="url(#truckGoldBanner)" />
    <!-- Bumper -->
    <path d="M 108 522 C 130 518, 245 515, 260 522 C 265 528, 255 550, 248 555 C 220 560, 120 562, 104 555 C 98 548, 100 530, 108 522 Z" fill="url(#truckGoldBanner)" />
    <path d="M 112 562 C 130 558, 230 556, 242 562 C 244 568, 238 574, 232 576 C 210 580, 125 582, 112 576 C 108 572, 108 566, 112 562 Z" fill="url(#truckGoldH)" />
  </g>

  <!-- RIGHT: Typography Matching User's Design -->
  <g transform="translate(420, 175)">
    <!-- Speed streaks on the TRUCKWITHEASE wordmark -->
    <text font-family="'Oswald', Impact, -apple-system, sans-serif" 
          font-weight="900" 
          font-style="italic"
          font-size="64" 
          letter-spacing="4" 
          fill="url(#truckGoldBanner)">
      TRUCKWITHEASE
    </text>
    
    <text y="50" 
          font-family="monospace, 'Courier New'" 
          font-weight="700" 
          font-size="14" 
          fill="#8A92A6" 
          letter-spacing="5">
      FLEET TELEMATICS · 49 CFR § 395 · FHWA RADAR
    </text>
  </g>
</svg>
