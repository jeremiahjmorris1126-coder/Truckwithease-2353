# Render Blueprint — TruckWithEase
#
# Purpose: give the app a public HTTPS origin that actually runs /api/*.
# Cloudflare Pages serves the marketing + legal pages (and satisfies the A2P
# reviewer), but it is static — POST /api/comms/inbound, the Twilio inbound
# webhook behind Sealed Line auto-replies, cannot exist there.
#
# Deploy: Render Dashboard → New → Blueprint → pick this repo. Render reads
# this file, then prompts once for every env var marked `sync: false`.
# Nothing secret is stored in this file; .env is gitignored and stays that way.

services:
  - type: web
    name: truckwithease
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # free tier sleeps after 15 min idle; a sleeping webhook drops Twilio inbounds
    region: ohio
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # --- Database (Turso) — required, the API will not serve without it ---
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false

      # --- Auth ---
      - key: BETTER_AUTH_SECRET
        sync: false

      # --- Twilio — the reason this service exists ---
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

      # --- AI ---
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: AI_GATEWAY_BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # --- Object storage (IDrive e2, S3-compatible) ---
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_FORCE_PATH_STYLE
        sync: false

      # --- Email ---
      - key: POSTMARK_SERVER_TOKEN
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false

      # --- Third-party data ---
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: APIFREAKS_API_KEY
        sync: false
      - key: AZUGA_API_KEY
        sync: false
      - key: FLEETIO_API_KEY
        sync: false
      - key: FLEETIO_ACCOUNT_TOKEN
        sync: false
      - key: CHECKR_SECRET_KEY
        sync: false
      - key: RUNWARE_API_KEY
        sync: false
      - key: AUTUMN_SECRET_KEY
        sync: false

      # --- Build-time (VITE_* are inlined into the bundle by vite build,
      #     so they must be present during the Docker build, not just runtime) ---
      - key: VITE_APPLICATION_ID
        sync: false
      - key: VITE_GOOGLE_MAPS_KEY
        sync: false
      - key: VITE_RUNABLE_AUTH_ISSUER
        sync: false
      - key: APPLICATION_ID
        sync: false
      - key: WEBSITE_URL
        sync: false
